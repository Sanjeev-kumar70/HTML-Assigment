<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Assignment 2 - Feedback Form</title>
</head>
<body>
    <h1 align="center" >Assignment 2 - Feedback Form</h1><hr><br>
    <form align="left-right">
        <!--Start Lable Tag-->
    <label>Name:</label>
    <input type="text" name="name" ><br><br>
    <label>Email :</label>
    <input type="text" name="email"><br><br>
    <label>password :</label>
    <input type="password" name="password"><br>
    <!--End Lable tag-->
    <h3>Select all emotions that apply to you:</h3><br>
    <!--Start Checkbox tag-->
    <input type="checkbox" name="Angry" id="angry">
    <label>Angry</label><br>
    <input type="checkbox" name="Sad" id="Sad">
    <label>Sad</label><br>
    <input type="checkbox" name="Happy" id="Happy">
    <label>Happy</label><br>
    <input type="checkbox" name="Ambivalent" id="Ambivalent">
    <label>Ambivalent</label><br>
    <!--End Checkbox Tag-->
<!--Start radio Tag-->
    <h3>How satisfied were you with our service?</h3>
    <input type="radio" name="very Satisfied" id="very Satisfied">
    <label>Very Satisfied</label><br>
    <input type="radio" name="Satisfied" id="Satisfied">
    <label>Satisfied</label><br>
    <input type="radio" name="Did not care" id="Did not care">
    <label>Did not care</label><br>
    <input type="radio" name="Dissatisfied" id="Dissatisfied">
    <label>Dissatisfied</label><br>
    <input type="radio" name="Very dissatisfied" id="Very dissatisfied">
    <label> Very dissatisfied</label><br><br>
    <!--End radio tag-->
    <!--Start Textarea tag-->
    <label>Further Comments</label>
    <textarea name="comments"id="comments"></textarea><br><br>
    <!--End Textarea tag-->
    <!-- Start choose file-->
    <label>Bio Photo:</label>
    <input type="file" type="file"><br><br>
    <!--End Choose file-->
    <!--Start Select tag-->
    <label>Location visited:</label>
    <select>
        <option>select location</option>
        <option>Ghazipur</option>
        <option>Agra</option>
        <option>Mau</option>
        <option>Kanpur</option>
    </select><br><br>
    <!--End Select Tag-->
    <input type="submit">
    <p>Use text,email,password checkbox,radio,file,select,textarea and submit input.</p>
    <p><b>Figure 2.</b>Feedback Form using pure HTML.</p>
    </form>
</body>
</html>
